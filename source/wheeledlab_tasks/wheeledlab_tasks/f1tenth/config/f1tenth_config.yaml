# config.yaml
env_config:
  MAP_NAME_LIST: ['JED']
  ORIGIN_LIST: [[0, 0], [0, 0], [0, 0], [0, 0]]

  # When comparing real data that don't use incremental it must always be set to False
  INCREMENTAL_MODE: True
  MAX_SPEED_INCREMENT: 0.13
  MAX_SPEED_SCALING: 8
  MAX_STEERING_SCALING: 0.42
  SPEED_OFFSET: 0
  STEERING_OFFSET: 0.0
  VD_ENHANCED: False

  DYNAMIC_FRICTION: 0.75
  STATIC_FRICTION: 0.75
  RESTITUTION: 0.0

  CONSTANT_SPEED: False
  CONSTANT_SPEED_TARGET: 5

  # usually both true
  NON_TRAVERSABLE_TERMINATION: True
  RESET_RANDOM: True
  PLAY_POLICY: False

  # SIM_DT: Physics simulation time step
  # SIM_DECIMATION: Number of physics steps per simulation step; 
  # The actions, observations, and rewards are computed every SIM_DECIMATION steps, and every SIM_DECIMATION*SIM_DT seconds.
  EPISODE_LENGTH_S: 10
  SIM_DT: 0.00625
  SIM_DECIMATION: 8
  # SIM_DT: 0.01
  # SIM_DECIMATION: 8

  LEN_S_IDX: 0.1 
  # SIM_DT: 0.003125

  MIN_DELAY_STEERING: 24 #sim dt steps
  MAX_DELAY_STEERING: 24
  MIN_DELAY_THROTTLE: 8 #sim dt steps
  MAX_DELAY_THROTTLE: 8
  # MIN_DELAY_STEERING: 0 #sim dt steps
  # MAX_DELAY_STEERING: 0
  # MIN_DELAY_THROTTLE: 0 #sim dt steps
  # MAX_DELAY_THROTTLE: 0

  # PROGRESS_HISTORY_LENGTH: Number of last waypoints to store in the history buffer, every every SIM_DECIMATION*SIM_DT seconds.
  # PROGRESS_HISTORY_CHECKPOINT_IDX: Index of the last checkpoint in the history buffer used to compute the difference in progress
  PROGRESS_HISTORY_LENGTH: 20
  PROGRESS_HISTORY_CHECKPOINT_IDX: 4

  ACTION_HISTORY_LENGTH: 4
  OBS_HISTORY_LENGTH: 4
  REW_HISTORY_LENGTH: 4

  WALL_COLLISION_RADIUS: 0.28
  
  MAX_PROGRESS_IDX: 30 

  # True if lookahed changes with current velocity
  DYNAMIC_LOOKAHEAD: True
  T_HORIZON: 4
  # Otherwise use constant idx steps (s_horizon = delta_s_idx [0.1m/idx] * N_horizon_idx [idx])
  DELTA_S_IDX: 10
  N_HORIZON: 20

  OPP_SIZE_RADIUS: 0.18
  OPP_MOVE_DT: 0.05
  OPP_COLLISION_RADIUS: 0.4
  OPP_VEL_SCALING: 0.5 # (vel scaling = 0.2 + OPP_VEL_SCALING)
  OPP_MIN_VEL_SCALING: 0.2
  OPPONENT_INIT_DISTANCE_IDX: 15
  OPPONENT_FAR_AWAY_IDX: 40
  OPPONENT_OVERTAKEN_IDX: 5
  IGNORE_OPPONENT_UNTIL_EP: 0
  STATIC_OPPONENT_UNTIL_EP: 0
